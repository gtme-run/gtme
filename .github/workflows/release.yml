# Release: on a version tag, build the §13 targets and attach them to a
# GitHub release. Pure Go, no cgo (SPEC §2), so one Linux runner
# cross-compiles everything. The binaries carry the tag via the same
# ldflags Makefile `build` uses; checksums published beside them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check
        run: make check
      - name: build all targets
        run: |
          set -euo pipefail
          # Static binaries: without this the native linux/amd64 build links
          # libc through net's cgo resolver (SPEC §2: pure Go, no cgo).
          export CGO_ENABLED=0
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath \
                -ldflags "-X github.com/gtme-run/gtme/internal/cli.Version=${VERSION}" \
                -o "dist/gtme" ./cmd/gtme
            tar -czf "dist/gtme_${VERSION}_${target%/*}_${target#*/}.tar.gz" -C dist gtme
            rm dist/gtme
            # instantly/add-to-campaign, a registry process entry (ADR-063):
            # manifest.json + run at the archive root, the manifest written by
            # the executable itself so the two cannot drift. The gtme-bindings
            # index pins each archive's sha256 from checksums.txt.
            mkdir -p dist/instantly
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o dist/instantly/run ./cmd/gtme-instantly
            go run ./cmd/gtme-instantly --manifest > dist/instantly/manifest.json
            tar -czf "dist/gtme-instantly_${VERSION}_${target%/*}_${target#*/}.tar.gz" -C dist/instantly manifest.json run
            rm -r dist/instantly
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.txt)
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "gtme ${GITHUB_REF_NAME}" \
            --notes "Prebuilt binaries for macOS and Linux (arm64/amd64). The gtme-instantly archives are the instantly/add-to-campaign process adapter; install it with \`gtme adapters add instantly/add-to-campaign\`, which pins each archive by its checksum. Verify with checksums.txt, untar, put \`gtme\` on your PATH, run \`gtme init\`. Building from source stays \`git clone && ./install.sh\`. The CLI surface is SPEC.md §8; agents start with \`gtme help --agent\`."
