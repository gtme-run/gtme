# The pipeline from SPEC §9, ready to run once its adapters are installed and
# the four credentials are set. Every vendor adapter is a registry entry
# (ADR-059, ADR-063):
#
#   gtme adapters add apollo/search apollo/enrich harvest/profile harvest/recent-posts \
#     instantly/add-to-campaign
#
#   gtme secret set APOLLO_API_KEY
#   gtme secret set HARVEST_API_KEY
#   gtme secret set ANTHROPIC_API_KEY
#   gtme secret set INSTANTLY_API_KEY
#
#   gtme plan examples/apollo-to-instantly.yaml   # free: no calls, no spend
#   gtme run  examples/apollo-to-instantly.yaml   # spends money and adds real leads
#
# The Instantly campaign must already exist and is named by its id (from its
# URL in Instantly), never its name, so renaming it changes nothing (ADR-062).
# Delivery is keyed on email, so re-running never adds the same person twice.
name: apollo-to-instantly
version: 1

source:
  use: apollo/search
  with:
    query: "saas"
    titles: ["vp marketing", "head of marketing"]
    employee_ranges: ["50,200"]
    limit: 500

steps:
  - id: icp-filter
    use: ai/filter
    uses: [first_name, title, company_name]   # masked fields only — free (ADR-043)
    with:
      template: >
        Keep only contacts likely to own outbound tooling decisions.
      batch_size: 25

  - id: reveal          # ADR-043: pay Apollo's per-credit reveal only past the filter
    use: apollo/enrich
    when: icp-filter.passed
    cache: 30d

  - id: linkedin
    use: harvest/profile
    when: icp-filter.passed
    cache: 30d

  - id: posts           # ADR-059: posts are their own call, asked for by name
    use: harvest/recent-posts
    when: icp-filter.passed
    cache: 30d
    with:
      posts_limit: 3

  - id: personalize
    use: ai/compose
    when: icp-filter.passed
    uses: [recent_posts, role_history]
    with:
      template: >
        Write first_line and ps_line using recent_posts and role_history.
        first_line references something specific and recent; ps_line is one
        short, low-pressure sentence. No flattery, no exclamation marks.
      batch_size: 25

  - id: send            # ADR-031: a deliver adapter is an ordinary step
    use: instantly/add-to-campaign
    with:
      campaign: 0198a0b1-2c3d-4e5f-8a9b-0c1d2e3f4a5b   # the campaign id, from its URL in Instantly (ADR-062)
    variables:          # ADR-018/019: egress mapping, and the step's dynamic needs
      first_line: first_line
      ps_line: ps_line
    idempotency: email
