# The zero-key demo: `gtme run examples/demo.yaml --simulate` executes this
# entire pipeline offline — the Apollo source is served from its conformance
# fixtures, the AI steps answer synthetically (marked as such), and delivery
# is held with its variables resolved into the receipt. No API keys, no
# network, no spend, nothing persisted.
#
# The Apollo and Instantly adapters are registry entries (ADR-059, ADR-063),
# so install them first:
#   gtme adapters add apollo/search apollo/enrich instantly/add-to-campaign
#
# With real keys set (gtme secret set APOLLO_API_KEY / ANTHROPIC_API_KEY /
# INSTANTLY_API_KEY) and the Instantly campaign below existing (its id), the
# same file climbs the rest of the ladder:
#   gtme plan examples/demo.yaml          # contracts + cost, still $0
#   gtme run  examples/demo.yaml --dry-run  # everything but delivery
#   gtme run  examples/demo.yaml          # armed
name: demo
version: 1

source:
  use: apollo/search        # a vendor adapter that is pure YAML, installed from the registry
  with:
    query: vp marketing, saas
    limit: 1                  # one person through the whole chain first; raise it once a dry-run receipt reads right

steps:
  - id: fit
    use: ai/filter
    uses: [title, company_name]   # what the search shows before a paid reveal — free (ADR-043)
    with:
      template: >
        Keep only people who plausibly own outbound tooling decisions.

  - id: reveal              # ADR-043: pay Apollo's per-credit reveal only past the filter
    use: apollo/enrich
    when: fit.passed
    cache: 30d

  - id: lines
    use: ai/compose
    when: fit.passed
    uses: [full_name, title, company_name]
    with:
      template: >
        Write first_line and ps_line for a short, honest intro email.

  - id: send                # a deliver adapter is an ordinary step (ADR-031)
    use: instantly/add-to-campaign
    with: { campaign: 0198a0b1-2c3d-4e5f-8a9b-0c1d2e3f4a5b }   # the campaign id, from its URL in Instantly; must exist
    variables:
      first_name: first_name
      first_line: first_line
    idempotency: email      # re-runs deliver nothing twice, ever
