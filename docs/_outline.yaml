    - { slug: bundles, name: Package and share a campaign, status: planned }
    - { slug: claude-code, name: Use gtme from Claude Code, status: planned }
    - { slug: add-a-binding, name: Add a vendor with a binding, status: planned }
    - { slug: process-adapter, name: Write a process adapter, status: planned }
    - { slug: publish-to-registry, name: Publish to the registry, status: planned }
  reference:
    - { slug: cli, name: CLI, status: planned, children: [init, plan, run, runs, show, query, answer, freeze, groups, secret, adapters, vacuum, help, version] }
    - { slug: pipeline-yaml, name: pipeline.yaml keys, status: planned }
    - { slug: adapters, name: Adapter catalog, status: planned }
