# The docs site map. Underscore-prefixed, so Spandrel ignores it.
#
# Two jobs: (1) the writing queue, in order; (2) the set of paths a page may
# link to. A link to a planned page is fine; a link to a path not in this
# file is a lint error, so nobody invents a slug.
#
# status: planned | draft | reviewed | published

budgets: # prose words, code blocks excluded
  start: 600 # raised from 500 on 2026-09-25: See-it-run review asked for the pipeline file on the page
  concepts: 900
  guides: 1200
  reference: 0 # generated; no budget

collections:
  start:
    - { slug: install, name: Install, status: reviewed }
    - { slug: show-me, name: See it run, status: reviewed }
    - { slug: my-csv, name: Your CSV, status: reviewed }
    - { slug: my-stack, name: Your stack, status: reviewed }
