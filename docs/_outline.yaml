    - { slug: ledger, name: The ledger, status: draft }
    - { slug: identity-keys, name: Identity keys, status: draft }
    - { slug: canonical-fields, name: Canonical fields, status: draft }
    - { slug: facts, name: Facts have provenance, status: draft }
    - { slug: groups, name: Groups and segments, status: draft }
    - { slug: types-and-traverse, name: Types and traverse, status: draft }
    - { slug: participants, name: Participants, status: draft }
    - { slug: campaign-is-a-folder, name: A campaign is a folder, status: draft }
    - { slug: adapter-tiers, name: Two adapter tiers, status: draft }
    - { slug: agent-operable, name: Agent-operable by design, status: planned }
  guides:
    - { slug: first-pipeline, name: Build your first pipeline from a CSV, status: planned }
    - { slug: connect-your-stack, name: "Connect your stack: secrets, plan, dry-run, arm", status: planned }
    - { slug: launch, name: Launch, status: planned }
    - { slug: guard, name: Guard, status: planned }
    - { slug: report, name: Report, status: planned }
    - { slug: interrogate, name: Interrogate, status: planned }
    - { slug: top-up, name: Top up, status: planned }
    - { slug: iterate, name: Iterate, status: planned }
    - { slug: recover, name: Recover, status: planned }
    - { slug: segment, name: Segment, status: planned }
    - { slug: multi-stage, name: Multi-stage campaigns with groups, status: planned }
