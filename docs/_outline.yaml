# Canon rendered outside the nav. Anchors are allowed after these.
canon:
  - /spec
  - /decisions

# The project's nouns. When a page mentions one that isn't its own subject,
# the lint expects a link to the term's page on first mention, or a one-line
# gloss. Keys are matched as whole words, case-insensitive.
terms:
  ledger: /concepts/ledger
  receipt: /concepts/runs-and-receipts
  identity key: /concepts/identity-keys
  canonical field: /concepts/canonical-fields
  provenance: /concepts/facts
  confidence: /concepts/facts
  projection: /concepts/ledger
  gate ladder: /concepts/gate-ladder
  simulate: /concepts/gate-ladder
  dry-run: /concepts/gate-ladder
  armed: /concepts/gate-ladder
  adapter: /concepts/adapter-tiers
  binding: /concepts/adapter-tiers
  process adapter: /concepts/adapter-tiers
  group: /concepts/groups
  segment: /concepts/groups
  traverse: /concepts/types-and-traverse
  participant: /concepts/participants
  bundle: /concepts/campaign-is-a-folder
  freeze: /concepts/campaign-is-a-folder
  idempotency: /concepts/runs-and-receipts
