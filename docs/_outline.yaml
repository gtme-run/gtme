# The docs site map. Underscore-prefixed, so Spandrel ignores it.
#
# Two jobs: (1) the writing queue, in order; (2) the set of paths a page may
# link to. A link to a planned page is fine; a link to a path not in this
# file is a lint error, so nobody invents a slug.
#
# status: planned | draft | reviewed | published | generated
#
# The reference children and the terms map are written by `make docs-reference`
# (cmd/docsgen); edit the sources they come from, not the lines here.

budgets: # prose words, code blocks excluded
  start: 600 # raised from 500 on 2026-09-25: See-it-run review asked for the pipeline file on the page
  concepts: 900
  guides: 1200
  reference: 0 # generated; no budget

# Who a page is for. A page lists one or more of these in its frontmatter
# `roles:`; the docs index renders one entry path per role. Roles are
# attributes of pages, not pages: nothing is written about a role itself.
roles:
  operator:
    name: I run campaigns
    entry: /start/show-me
    description: Reads plans and receipts, answers review steps, tops up, and reports. May never write a pipeline from scratch.
  builder:
    name: I build pipelines
    entry: /start/my-csv
    description: Writes pipeline files, often with an agent beside them.
  extender:
    name: I add a vendor
    entry: /start/add-a-vendor
    description: Writes a binding or a process adapter for a vendor gtme doesn't ship.
  agent:
    name: I am an agent
    entry: /start/for-agents
    description: Claude or another model driving gtme for one of the people above; reads Reference and help --agent.

collections:
  start:
    - { slug: install, name: Install, status: reviewed }
    - { slug: show-me, name: See it run, status: reviewed }
    - { slug: my-csv, name: Your CSV, status: reviewed }
    - { slug: my-stack, name: Your stack, status: reviewed }
    - { slug: add-a-vendor, name: Add a vendor, status: reviewed }
    - { slug: for-agents, name: For agents, status: reviewed }
  concepts: # part: run = how a run works (operator); model = how the model works (builder, extender)
    - { slug: pipeline, name: A pipeline is a YAML file, status: reviewed, part: model }
    - { slug: steps-and-roles, name: Steps and roles, status: reviewed, part: model }
    - { slug: gate-ladder, name: The gate ladder, status: reviewed, part: run }
    - { slug: runs-and-receipts, name: Runs and receipts, status: reviewed, part: run }
    - { slug: ledger, name: The ledger, status: draft, part: run }
    - { slug: identity-keys, name: Identity keys, status: reviewed, part: model }
    - { slug: canonical-fields, name: Canonical fields, status: reviewed, part: model }
    - { slug: facts, name: Facts have provenance, status: reviewed, part: model }
    - { slug: groups, name: Groups and segments, status: reviewed, part: run }
    - { slug: types-and-traverse, name: Types and traverse, status: reviewed, part: model }
    - { slug: participants, name: Participants, status: reviewed, part: run }
    - { slug: campaign-is-a-folder, name: A campaign is a folder, status: reviewed, part: run }
    - { slug: adapter-tiers, name: Two adapter tiers, status: reviewed, part: model }
    - { slug: agent-operable, name: Agent-operable by design, status: planned, part: model }
  guides:
    - { slug: first-pipeline, name: Build your first pipeline from a CSV, status: planned }
    - { slug: connect-your-stack, name: "Connect your stack: secrets, plan, dry-run, arm", status: planned }
    - { slug: launch, name: Launch, status: planned }
    - { slug: guard, name: Guard, status: planned }
    - { slug: report, name: Report, status: planned }
    - { slug: interrogate, name: Interrogate, status: planned }
    - { slug: top-up, name: Top up, status: planned }
    - { slug: iterate, name: Iterate, status: planned }
    - { slug: recover, name: Recover, status: planned }
    - { slug: segment, name: Segment, status: planned }
    - { slug: multi-stage, name: Multi-stage campaigns with groups, status: planned }
    - { slug: traverse, name: Traverse a relation, status: planned }
    - { slug: human-in-the-loop, name: Put a human in the loop, status: planned }
    - { slug: cron-and-events, name: Run on cron and events, status: planned }
    - { slug: bundles, name: Package and share a campaign, status: planned }
    - { slug: claude-code, name: Use gtme from Claude Code, status: planned }
    - { slug: add-a-binding, name: Add a vendor with a binding, status: planned }
    - { slug: process-adapter, name: Write a process adapter, status: planned }
    - { slug: publish-to-registry, name: Publish to the registry, status: planned }
  reference:
    - { slug: cli, name: CLI, status: generated, children: [init, secret, plan, run, query, show, answer, runs, freeze, groups, vacuum, adapters, help, version] }
    - { slug: pipeline-yaml, name: pipeline.yaml keys, status: planned }
    - { slug: adapters, name: Adapter catalog, status: generated, children: [agent-compose, agent-filter, agent-review, ai-compose, ai-filter, ai-review, apollo-enrich, apollo-search, attio-assert, csv-deliver, csv-source, demo-enrich, harvest-profile, http-deliver, http-enrich, human-compose, human-filter, human-review, instantly-add-to-campaign, text-compose] }
    - { slug: bundles, name: Bundles, status: planned }
    - { slug: fields, name: Canonical field registry, status: generated, children: [company, person, post] }
    - { slug: ledger-schema, name: Ledger schema and views, status: generated, children: [identities, field_values, relations, runs, run_records, step_events, costs, deliveries, field_value_ranks, current_fields, groups, group_events, group_members, current_values, group_membership, payloads] }
    - { slug: plugin-skills, name: Plugin skills, status: planned }
    - { slug: binding-manifest, name: Binding manifest, status: planned }
    - { slug: wire-protocol, name: Wire protocol, status: planned }
    - { slug: conformance, name: Conformance kit and fixtures, status: planned }

# Single pages outside the collections, rendered at the root of the nav.
pages:
  - { slug: glossary, name: Glossary, status: generated }

# Canon rendered outside the nav. Anchors are allowed after these.
canon:
  - /spec
  - /decisions

